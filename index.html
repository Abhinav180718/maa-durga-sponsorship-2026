<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Trails Durga Puja 2026</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#222}
header{background:linear-gradient(135deg,#8b1e3f,#c43d61);color:#fff;padding:28px 16px}
.wrap{max-width:1100px;margin:auto;padding:0 14px}
h1{margin:0 0 6px} .muted{color:#666;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}
.label{font-size:11px;color:#777;text-transform:uppercase} .value{font-size:24px;font-weight:bold;margin-top:6px}
.panel{margin-bottom:16px} .tools{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff}
input{flex:1;min-width:220px}button{background:#8b1e3f;color:#fff;cursor:pointer}
.table{overflow:auto} table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:13px}th{background:#fafafa}
.err{display:none;background:#fff3cd;padding:12px;border-radius:8px;margin:12px 0}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Happy Trails Durga Puja 2026</h1><div>Residents Sponsorship Dashboard</div><div id="status" style="margin-top:10px;font-size:13px">Loading…</div></div></header>
<main class="wrap">
<div id="err" class="err"></div>
<section class="cards">
<div class="card"><div class="label">Total Sponsorship</div><div id="total" class="value">₹0</div></div>
<div class="card"><div class="label">Sponsors</div><div id="sponsors" class="value">0</div></div>
<div class="card"><div class="label">Entries</div><div id="entries" class="value">0</div></div>
<div class="card"><div class="label">Average</div><div id="avg" class="value">₹0</div></div>
</section>
<section class="panel">
<div class="tools"><input id="q" placeholder="Search resident, flat or sponsorship…"><select id="cat"><option value="">All categories</option></select><button onclick="load(true)">Refresh</button></div>
</section>
<section class="panel"><h2>Sponsorship Details</h2><div id="loading" class="muted">Fetching live data…</div><div class="table"><table><thead><tr><th>Date</th><th>Resident / Flat</th><th>Category</th><th>Sponsorship</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><h2>Category Totals</h2><div id="cats" class="muted">Loading…</div></section>
</main>
<script>
const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRa0TTTTg6PYdRVgcgxuQ4YUAvFObRoItX1rWtYkhbDI_jDLCKi2Itu_QrUP8kmBLdwwnoAvLfR6343701MD-uFT36E8EFuOI3-Yl7nVacPJKveSqPigmlx4g7b-QJeS5OnXoIPpJnQTnZ8VYv08XxSf0pfBHMDDlQZBj0B-Lps5MOWBgX00EZiwwBk5FbE3Wjn9iXTUC0tQ1NjbBAFbCNxIbGrWjZqr-hcGBkTXnXr8sFylV9h0myXKKnJF5IGVKT2WxzV_3JhwDU573jelk80TEFi8w&lib=M8qGv1nKpNFyrAXvebTACHMzbBMI2do0S';
const CACHE="happy_trails_puja_cache_v1";
let entries=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");

function amount(s){
 let t=0,x=String(s||"").replace(/,/g,""),m;
 m=x.match(/₹\s*(\d+(?:\.\d+)?)/gi)||[]; m.forEach(v=>t+=parseFloat(v.replace(/[₹\s]/g,""))||0);
 m=x.match(/(\d+(?:\.\d+)?)\s*K\b/gi)||[]; m.forEach(v=>t+=(parseFloat(v)||0)*1000);
 return t;
}
function makeEntries(r){
 const data=Array.isArray(r.data)?r.data:[], h=Array.isArray(r.headers)?r.headers:Object.keys(data[0]||{});
 const skip=new Set(["Timestamp","Mob Number","Mobile Number","Attach Payment screenshot (if possible)"]);
 let out=[];
 data.forEach(row=>h.forEach(k=>{
   if(skip.has(k)||!String(row[k]??"").trim()) return;
   out.push({date:row["Timestamp"]||"",person:row["Name & FLAT NO"]||row["Name & FLAT NO."]||"Unknown",category:k,text:String(row[k]),amount:amount(row[k])});
 }));
 return out;
}
function render(){
 const q=$("q").value.toLowerCase(), c=$("cat").value;
 const a=entries.filter(x=>(!q||(`${x.person} ${x.category} ${x.text}`).toLowerCase().includes(q))&&(!c||x.category===c));
 $("rows").innerHTML=a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.person)}</td><td>${esc(x.category)}</td><td>${esc(x.text)}</td><td><b>${x.amount?money(x.amount):"—"}</b></td></tr>`).join("")||'<tr><td colspan="5">No matching entries.</td></tr>';
 const total=entries.reduce((s,x)=>s+x.amount,0), people=new Set(entries.map(x=>x.person));
 $("total").textContent=money(total); $("sponsors").textContent=people.size; $("entries").textContent=entries.length; $("avg").textContent=money(entries.length?total/entries.length:0);
 const cats={}; entries.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
 $("cats").innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(x=>`<div style="margin:7px 0"><b>${esc(x[0])}</b> — ${money(x[1])}</div>`).join("")||"No data";
 $("loading").style.display="none";
}
function categories(){
 const a=[...new Set(entries.map(x=>x.category))].sort();
 $("cat").innerHTML='<option value="">All categories</option>'+a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}
async function load(force=false){
 if(!force)try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c){entries=makeEntries(c);categories();render();$("status").textContent="Showing cached data while checking for updates…"}}catch(e){}
 const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),10000);
 try{
   const r=await fetch(API_URL,{cache:"no-store",signal:ctl.signal});
   if(!r.ok)throw Error("HTTP "+r.status);
   const j=await r.json(); if(!j.success)throw Error(j.error||"API error");
   localStorage.setItem(CACHE,JSON.stringify(j)); entries=makeEntries(j); categories(); render();
   $("status").textContent="Live data updated • "+new Date().toLocaleTimeString();
   $("err").style.display="none";
 }catch(e){
   $("status").textContent="Showing latest available data";
   if(!entries.length){$("err").textContent="Could not load live sponsorship data. Please try Refresh.";$("err").style.display="block";}
 }finally{clearTimeout(timer)}
}
$("q").addEventListener("input",render); $("cat").addEventListener("change",render); load(false); setInterval(()=>load(false),300000);
</script>
</body></html>
